name: Build, Push to Docker Hub + GHCR, and Deploy (Production)

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-9]+.[0-9]+.[0-9]+'

env:
  DOCKERHUB_IMAGE: docker.io/bendlikeabamboo/barangay-api
  GHCR_IMAGE: ghcr.io/bendlikeabamboo/barangay-api

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - uses: ./.github/actions/ci

  build-and-push:
    needs: ci
    runs-on: self-hosted
    environment: prod
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Create buildx builder with container driver
        run: |
          docker buildx rm container-builder 2>/dev/null || true
          docker buildx create --name container-builder --driver docker-container --use

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    environment: prod
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to production
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"
          CONTAINER_NAME="barangay-api"

          echo "Logging in to GHCR ..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          echo "Stopping existing container ..."
          docker stop "$CONTAINER_NAME" 2>/dev/null || true
          docker rm "$CONTAINER_NAME" 2>/dev/null || true

          echo "Pulling ghcr.io/bendlikeabamboo/barangay-api:${IMAGE_TAG} ..."
          docker pull "ghcr.io/bendlikeabamboo/barangay-api:${IMAGE_TAG}"

          echo "Starting new container ..."
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p 48573:48573 \
            "ghcr.io/bendlikeabamboo/barangay-api:${IMAGE_TAG}"

          echo "Cleaning up old images ..."
          docker image prune -f

          echo "Waiting for health check ..."
          sleep 10
          if curl -sf http://localhost:48573/docs > /dev/null 2>&1; then
            echo "Health check passed."
          else
            echo "WARNING: Health check failed — check logs with: docker logs $CONTAINER_NAME"
            exit 1
          fi

          echo "Production deploy complete: ${IMAGE_TAG}"
